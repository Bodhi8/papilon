name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test dependencies
        run: pip install -e ".[dev,mcp]"
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -m "not slow and not jax" -q

  # The optional NUTS backend. The job above installs neither JAX nor NumPyro, which is what
  # shows the default install does not need them; this one installs the extra and runs its tests.
  jax-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the JAX extra
        run: pip install -e ".[dev,jax]"
      - name: Show the backend versions
        run: python -c "import jax, numpyro; print('jax', jax.__version__, 'numpyro', numpyro.__version__)"
      - name: Run the backend tests
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -m jax -q

  examples-and-slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp]"
      - name: Slow tests
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -m slow -q
      - name: Examples
        env:
          MPLBACKEND: Agg
        run: |
          for f in examples/checkable_mmm.py examples/production_workflow.py; do
            echo "::group::$f"; python "$f"; echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build && python -m twine check --strict dist/*
