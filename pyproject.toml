[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papilon"
version = "1.1.0"
description = "A Bayesian marketing mix model you can check: graded against known truth, with a marketing knowledge graph, self-checks, lift-test planning and grounded tools for AI assistants"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Brian Curry", email = "brian@vector1.ai" }]
keywords = [
    "marketing mix modeling", "MMM", "media mix model", "bayesian", "adstock",
    "importance sampling", "causal inference", "budget optimization", "statistical mechanics",
    "knowledge graph", "ontology", "lift test", "incrementality", "model context protocol", "simulation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]
mcp = ["mcp>=1.2"]
jax = ["jax>=0.6", "numpyro>=0.19"]   # NUTS sampler for very large models (sampler="nuts")
mlflow = ["mlflow>=2.10"]
snowflake = ["snowflake-connector-python[pandas]>=3.6"]
bigquery = ["google-cloud-bigquery[pandas]>=3.17"]
sql = ["sqlalchemy>=2.0"]
all = ["mcp>=1.2", "mlflow>=2.10", "sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://vector1.ai"
Repository = "https://github.com/Bodhi8/papilon"
Issues = "https://github.com/Bodhi8/papilon/issues"
Changelog = "https://github.com/Bodhi8/papilon/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["papilon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full Bayes-factor fit, takes a few minutes",
    "jax: needs the optional JAX backend (pip install \"papilon[jax]\")",
]
