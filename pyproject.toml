[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papilon"
version = "0.3.0"
description = "Bayesian marketing mix modeling with gated importance sampling, plus causal data simulation and complex-systems tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Brian Curry", email = "brian@vector1.ai" }]
keywords = [
    "marketing mix modeling", "MMM", "media mix model", "bayesian", "adstock",
    "importance sampling", "causal inference", "budget optimization", "statistical mechanics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://vector1.ai"
Repository = "https://github.com/Bodhi8/papilon"
Issues = "https://github.com/Bodhi8/papilon/issues"
Changelog = "https://github.com/Bodhi8/papilon/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["papilon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full Bayes-factor fit, takes a few minutes"]
